<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Flash phone · 通话工作区</title>
<style>
:root{
  --brand:#4F46E5;--brand-2:#6366F1;--brand-soft:#EEF0FF;--on-brand:#fff;
  --flash:#F59E0B;--flash-soft:#FFF4DB;
  --ok:#15803D;--ok-soft:#E7F6EC;--warn:#B45309;--warn-soft:#FEF3E2;--danger:#DC2626;--danger-soft:#FDECEC;--info:#0369A1;--info-soft:#E6F3FA;
  --bg:#F4F5F9;--surface:#FFFFFF;--surface-2:#F7F8FB;--line:#E6E8EF;--line-2:#EEF0F4;
  --text:#111827;--text-2:#4B5563;--text-3:#6B7280;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.05);
  --r-s:10px;--r:16px;--r-l:22px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",Roboto,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
html[data-theme="dark"]{
  --brand:#818CF8;--brand-2:#A5B4FC;--brand-soft:#23254A;--on-brand:#0B0D1A;
  --flash:#FBBF24;--flash-soft:#3A2E12;
  --ok:#4ADE80;--ok-soft:#14301F;--warn:#FBBF24;--warn-soft:#3A2C10;--danger:#F87171;--danger-soft:#3B1717;--info:#38BDF8;--info-soft:#0F2A3A;
  --bg:#0B0D12;--surface:#151821;--surface-2:#1C2030;--line:#262B3A;--line-2:#1F2331;
  --text:#F3F4F6;--text-2:#C2C7D2;--text-3:#9097A6;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:#DDE0EA;color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[data-theme="dark"] body{background:#05060A}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}

/* device frame */
#device{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  #device{width:390px;height:844px;max-height:calc(100vh - 48px);border-radius:44px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.35)}
}
.statusbar{position:absolute;top:0;left:0;right:0;height:34px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;pointer-events:none;color:var(--text)}
.statusbar.light{color:#fff}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.statusbar svg{width:15px;height:15px}

/* screens */
#stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;will-change:transform}
.screen.enter{animation:pushIn .26s var(--ease)}
.screen.leave{animation:pushOut .22s var(--ease) forwards}
.screen.under{transform:translateX(-22%);transition:transform .26s var(--ease)}
.screen.modal.enter{animation:modalIn .3s var(--ease)}
.screen.modal.leave{animation:modalOut .24s var(--ease) forwards}
.screen.fade.enter{animation:fadeIn .25s ease}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{to{transform:translateX(100%)}}
@keyframes modalIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes modalOut{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.has-tabbar .scroll{padding-bottom:110px}

/* top bars */
.topbar{padding:42px 16px 8px;display:flex;align-items:center;gap:8px;min-height:92px;background:var(--bg);flex-shrink:0}
.topbar h1{font-size:28px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.02em;flex:1}
.topbar .sub{font-size:13px;color:var(--text-3)}
.navbar{padding:40px 6px 6px;display:flex;align-items:center;gap:4px;min-height:86px;background:var(--bg);flex-shrink:0;border-bottom:1px solid transparent}
.navbar .title{flex:1;font-size:17px;font-weight:650;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .spacer{width:44px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.iconbtn:active{background:var(--line-2)}
.iconbtn svg{width:22px;height:22px}

/* tabbar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:84px;padding:6px 8px 22px;display:flex;align-items:flex-start;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);transition:transform .25s var(--ease)}
#tabbar.hidden{transform:translateY(150%);visibility:hidden;transition:transform .25s var(--ease),visibility 0s .25s}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-3);padding-top:4px;min-height:52px;position:relative}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--brand);font-weight:600}
.tab .dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:700}
.tab-fab{flex:1;display:flex;justify-content:center}
.tab-fab button{width:54px;height:54px;margin-top:-18px;border-radius:18px;background:linear-gradient(135deg,var(--brand),#7C3AED);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.tab-fab svg{width:26px;height:26px}

/* cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card,.section+.section{margin-top:12px}
.card.pad{padding:16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.section-h h2{font-size:13px;font-weight:650;color:var(--text-3);margin:0;letter-spacing:.02em}
.section-h a,.link{font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;min-height:32px;display:inline-flex;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left;position:relative}
button.row:active,.row.tap:active{background:var(--surface-2)}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line-2)}
.row.noicon+.row.noicon::before{left:14px}
.row .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--brand-soft);color:var(--brand)}
.row .ic svg{width:20px;height:20px}
.ic.ok{background:var(--ok-soft);color:var(--ok)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.danger{background:var(--danger-soft);color:var(--danger)}.ic.info{background:var(--info-soft);color:var(--info)}.ic.flash{background:var(--flash-soft);color:var(--flash)}.ic.gray{background:var(--surface-2);color:var(--text-2)}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--text-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .v{font-size:13px;color:var(--text-3);white-space:nowrap}
.row .chev{color:var(--text-3);width:18px;height:18px;flex-shrink:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.danger{background:var(--danger-soft);color:var(--danger)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.brand{background:var(--brand-soft);color:var(--brand)}.chip.flash{background:var(--flash-soft);color:var(--warn)}
.chip .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill-btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-btn.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill-btn svg{width:15px;height:15px}

/* buttons */
.btn{height:50px;border-radius:14px;padding:0 18px;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}

/* switch */
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
.switch.on{background:var(--ok)}
html[data-theme="dark"] .switch.on{background:#22A55A}
.switch.on::after{transform:translateX(20px)}

/* segmented */
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:3px;gap:2px}
html[data-theme="dark"] .seg{background:var(--surface-2)}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* home hero */
.hero{border-radius:var(--r-l);padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,#4338CA 0%,#6D28D9 60%,#7C3AED 100%);box-shadow:0 12px 30px rgba(79,70,229,.28)}
.hero.off{background:linear-gradient(140deg,#374151,#1F2937)}
.hero.paused{background:linear-gradient(140deg,#B45309,#92400E)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero .h-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero .h-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.hero .h-ic svg{width:24px;height:24px}
.hero .h-title{font-size:18px;font-weight:700}
.hero .h-sub{font-size:13px;opacity:.85}
.hero .switch{background:rgba(255,255,255,.25)}
.hero .switch.on{background:#22C55E}
.hero .h-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.hero .h-meta span{font-size:12px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}
.hero .h-actions{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .h-actions button{flex:1;height:40px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:650}
.hero .h-actions button:active{background:rgba(255,255,255,.26)}

.live-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:#052e1a;color:#D1FAE5;margin-bottom:12px;width:100%;text-align:left}
.live-banner .lb-dot{width:10px;height:10px;border-radius:50%;background:#22C55E;animation:pulse 1.4s infinite;color:#22C55E}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2);min-height:80px}
.quick .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand)}
.quick .ic svg{width:20px;height:20px}

/* readiness */
.ready-head{display:flex;align-items:center;gap:14px;padding:16px}
.ring{width:56px;height:56px;flex-shrink:0;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:15px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:750}
.stat .l{font-size:12px;color:var(--text-3)}

/* call list */
.call-item .ic{border-radius:50%}
.call-item .t{display:flex;gap:6px;align-items:center}
.call-item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.date-h{font-size:12px;font-weight:650;color:var(--text-3);margin:16px 4px 6px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:0 12px}
.search svg{width:18px;height:18px;color:var(--text-3)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* forms */
.field{margin-bottom:16px}
.field label,.label{display:block;font-size:13px;font-weight:650;color:var(--text-2);margin:0 2px 6px}
.field .hint{font-size:12px;color:var(--text-3);margin:6px 2px 0;display:flex;justify-content:space-between;gap:8px}
.field .hint.err{color:var(--danger)}
.input,.textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.input{height:50px}
.textarea{min-height:96px;resize:none;line-height:1.5}
.input:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.input.err{border-color:var(--danger)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left;min-height:60px}
.opt+.opt{margin-top:8px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
.opt.on .radio{border-color:var(--brand)}
.opt.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.qlist .q{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qlist .q .n{width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qlist .q .input{height:44px;font-size:15px}

/* stepper */
.stepper{display:flex;gap:6px;padding:0 16px 4px}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper i.on{background:var(--brand)}
.step-cap{padding:8px 16px 0;font-size:12px;color:var(--text-3);font-weight:600}
.step-title{font-size:24px;font-weight:750;margin:6px 0 4px;letter-spacing:-.01em}
.step-sub{color:var(--text-3);font-size:14px;margin:0 0 18px}
.footer{padding:12px 16px 30px;background:var(--bg);border-top:1px solid var(--line);flex-shrink:0;display:flex;gap:10px}
.footer .btn.ghost{width:auto;padding:0 20px;flex-shrink:0;white-space:nowrap}

.review-block{padding:14px 16px}
.review-block+.review-block{border-top:1px solid var(--line-2)}
.review-block .k{font-size:12px;color:var(--text-3);font-weight:650;display:flex;justify-content:space-between}
.review-block .k a{color:var(--brand);cursor:pointer;min-height:24px}
.review-block .val{font-size:15px;margin-top:4px;white-space:pre-wrap}
.review-block ol{margin:4px 0 0;padding-left:20px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line)}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--text-3)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.notice.warn svg{color:var(--warn)}
.notice.info{background:var(--info-soft);border-color:transparent}

/* live call */
.live{background:radial-gradient(120% 70% at 50% 0%,#1E1B4B 0%,#0B0D16 60%);color:#E5E7EB}
.live .navbar{background:transparent;color:#fff}
.live .navbar .iconbtn{color:#fff}
.live-head{text-align:center;padding:0 16px 10px}
.live-avatar{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#A855F7);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;position:relative}
.live-avatar.speaking::before,.live-avatar.speaking::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(165,180,252,.5);animation:ripple 1.6s infinite}
.live-avatar.speaking::after{animation-delay:.8s}
@keyframes ripple{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.live-name{font-size:22px;font-weight:700;color:#fff}
.live-sub{font-size:14px;color:#A5B4FC;margin-top:2px}
.live-chips{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.live-chips .chip{background:rgba(255,255,255,.1);color:#E0E7FF}
.live-chips .chip.ok{background:rgba(34,197,94,.18);color:#86EFAC}
.live-chips .chip.warn{background:rgba(245,158,11,.2);color:#FCD34D}
.goal-card{margin:6px 16px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px}
.goal-card .gt{font-size:12px;color:#A5B4FC;font-weight:650;display:flex;justify-content:space-between}
.goal-card .gg{font-size:14px;color:#fff;margin:4px 0 6px}
.goal-q{display:flex;gap:8px;align-items:center;font-size:13px;color:#C7CBD6;padding:3px 0}
.goal-q .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid #6B7280;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s}
.goal-q.done .ck{background:#22C55E;border-color:#22C55E;color:#06210f}
.goal-q.done{color:#fff}
.goal-q .ck svg{width:12px;height:12px}
.transcript{flex:1;overflow-y:auto;padding:4px 16px 12px;scrollbar-width:none}
.transcript::-webkit-scrollbar{display:none}
.bubble{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;margin:6px 0;animation:fadeUp .3s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble .who{font-size:11px;font-weight:650;opacity:.7;margin-bottom:2px}
.bubble.caller{background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.bubble.ai{background:#4F46E5;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.me{background:#0E7490;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.sysline{text-align:center;font-size:12px;color:#9CA3AF;margin:10px 0}
.typing{display:inline-flex;gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.live-ctrl{padding:12px 16px 30px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.35) 30%)}
.ctrl-row{display:flex;justify-content:space-around}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#C7CBD6;min-width:64px}
.cbtn .cc{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.cbtn.on .cc{background:#fff;color:#111}
.cbtn.end .cc{background:#EF4444}
.cbtn svg{width:24px;height:24px}
.takeover{height:56px;border-radius:18px;background:#fff;color:#111827;font-size:17px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.takeover svg{width:22px;height:22px}
.takeover.done{background:rgba(14,116,144,.3);color:#A5F3FC}

/* incoming */
.incoming{background:linear-gradient(180deg,#0F172A,#1E1B4B);color:#fff;justify-content:space-between}
.ring-anim{width:110px;height:110px;margin:0 auto;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;position:relative}
.ring-anim::before,.ring-anim::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(165,180,252,.6);animation:ripple 1.8s infinite}
.ring-anim::after{animation-delay:.9s}
.ring-anim svg{width:40px;height:40px}
.countdown{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}

/* player */
.player{padding:14px 16px}
.wave{display:flex;align-items:center;gap:2px;height:34px;cursor:pointer;position:relative}
.wave i{flex:1;border-radius:2px;background:color-mix(in srgb,var(--c2) 28%,transparent);min-height:3px;transition:background .15s}
.wave.L{--c2:var(--info)}.wave.R{--c2:var(--brand)}
.wave.L i.p{background:var(--info)}
.wave.R i.p{background:var(--brand)}
.wave-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);font-weight:600;margin:6px 0 2px}
.wave-lab b{display:inline-flex;align-items:center;gap:5px}
.wave-lab b::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.pctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.playbtn{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.playbtn svg{width:22px;height:22px}
.ptime{flex:1;font-size:13px;color:var(--text-3)}
.ptime b{color:var(--text);font-size:15px}

.tline{display:flex;gap:10px;padding:10px 14px;border-radius:12px;transition:background .2s}
.tline.cur{background:var(--brand-soft)}
.tline .ts{font-size:12px;color:var(--text-3);width:36px;flex-shrink:0;padding-top:2px}
.tline .who{font-size:12px;font-weight:700;margin-bottom:1px}
.tline .who.ai{color:var(--brand)}.tline .who.caller{color:var(--info)}.tline .who.me{color:#0E7490}
.tline .tx{font-size:14.5px}
.result-card{padding:16px}
.result-card .rt{display:flex;align-items:center;gap:10px}
.result-card .rs{font-size:15px;margin-top:10px}
.actionbar{display:flex;gap:10px;padding:10px 16px 28px;border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}
.actionbar .btn{height:48px;font-size:15px}
.actionbar .iconbtn{border:1px solid var(--line);width:48px;height:48px;flex-shrink:0}

/* collapsible groups */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.group+.group{margin-top:12px}
.group-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;min-height:64px;text-align:left}
.group-h .gchev{width:20px;height:20px;color:var(--text-3);transition:transform .25s var(--ease)}
.group.open .group-h .gchev{transform:rotate(180deg)}
.group-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.group.open .group-b{grid-template-rows:1fr}
.group-b>div{overflow:hidden}
.group-b .inner{border-top:1px solid var(--line-2)}

/* sheet, dialog, toast */
#overlay{position:absolute;inset:0;z-index:80;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(10,12,20,.45);opacity:0;transition:opacity .25s;pointer-events:auto}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px 30px;transform:translateY(100%);transition:transform .28s var(--ease);pointer-events:auto;max-height:86%;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:18px;margin:4px 0 4px;font-weight:700}
.sheet .sd{font-size:13px;color:var(--text-3);margin:0 0 14px}
.sheet .sbody{overflow-y:auto}
.sheet .menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 4px;font-size:16px;text-align:left;border-radius:12px}
.sheet .menu-item:active{background:var(--surface-2)}
.sheet .menu-item svg{width:22px;height:22px;color:var(--text-2)}
.sheet .menu-item.danger,.sheet .menu-item.danger svg{color:var(--danger)}
.dialog{position:absolute;left:28px;right:28px;top:50%;transform:translate(0,-46%) scale(.96);opacity:0;background:var(--surface);border-radius:20px;padding:22px 20px 16px;transition:all .22s var(--ease);pointer-events:auto}
.dialog.show{opacity:1;transform:translate(0,-50%)}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 18px;color:var(--text-2);font-size:14px}
#toast{width:max-content;position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s var(--ease);z-index:90;pointer-events:none;max-width:86%;text-align:center;display:flex;gap:8px;align-items:center}
html[data-theme="dark"] #toast{background:#F3F4F6;color:#111}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:18px;height:18px;color:#4ADE80}

/* empty / skeleton */
.empty{text-align:center;padding:48px 24px;color:var(--text-3)}
.empty .eic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.empty .eic svg{width:30px;height:30px}
.empty h4{margin:0 0 4px;color:var(--text);font-size:16px}
.empty p{margin:0 0 16px;font-size:14px}
.sk{background:linear-gradient(90deg,var(--line-2) 25%,var(--surface-2) 50%,var(--line-2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.spinner{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s}
.code-inputs{display:flex;gap:8px;justify-content:center}
.code-inputs input{width:44px;height:54px;text-align:center;font-size:22px;font-weight:700;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.code-inputs input:focus{border-color:var(--brand)}
.wiz-hero{width:72px;height:72px;border-radius:22px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:8px 0 14px}
.wiz-hero svg{width:36px;height:36px}
.steps-list{counter-reset:s;margin:0;padding:0;list-style:none}
.steps-list li{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:14px;color:var(--text-2)}
.steps-list li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-row{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left;min-height:56px}
.check-row+.check-row{margin-top:8px}
.check-row .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.check-row.on{border-color:var(--ok)}
.check-row.on .cb{background:var(--ok);border-color:var(--ok)}
.check-row .cb svg{width:16px;height:16px}
.slider{width:100%;accent-color:var(--brand);height:32px}
.storage{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.storage i{display:block}
.mini{font-size:12px;color:var(--text-3)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;color:#FCD34D}
.brand-mark svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.ic svg{width:22px;height:22px}
.btn{white-space:nowrap}

const SCREENS={};
const stackEl=()=>$('#stack');
let stack=[];
const topE=()=>stack[stack.length-1];
function paint(e){
  if(!e)return;
  const def=SCREENS[e.name];
  const sc=e.el.querySelector('.scroll');const y=sc?sc.scrollTop:0;
  e.el.className='screen '+(def.cls||'')+(def.tab?' has-tabbar':'')+(e.extra||'');
  e.el.innerHTML=def.render(e.params||{},e);
  const sc2=e.el.querySelector('.scroll');if(sc2)sc2.scrollTop=y;
  def.after&&def.after(e);
}
function rerender(){paint(topE())}
function mount(name,params,anim){
  const el=document.createElement('div');
  const e={name,params:params||{},el,extra:' fresh'};setTimeout(()=>{e.extra='';el.classList.remove('fresh')},900);
  stackEl().appendChild(el);stack.push(e);paint(e);
  if(anim){const m=SCREENS[name].mode||'push';el.classList.add('enter');if(m==='modal')el.classList.add('modal');if(m==='fade')el.classList.add('fade');
    el.addEventListener('animationend',()=>el.classList.remove('enter','modal','fade'),{once:true});}
  chrome();return e;
}
function push(name,params){
  const prev=topE();const m=SCREENS[name].mode||'push';
  if(prev&&m==='push')prev.el.classList.add('under');
  closeOverlay();
  return mount(name,params,true);
}
function pop(){
  if(stack.length<=1)return;
  const e=stack.pop();const def=SCREENS[e.name];def.leave&&def.leave(e);
  const m=def.mode||'push';
  e.el.classList.add('leave');if(m==='modal')e.el.classList.add('modal');
  if(m==='fade'){e.el.style.transition='opacity .2s';e.el.style.opacity='0';}
  setTimeout(()=>e.el.remove(),280);
  const t=topE();t.el.classList.remove('under');paint(t);chrome();
}
function replaceTop(name,params){
  const e=stack.pop();const def=SCREENS[e.name];def.leave&&def.leave(e);
  setTimeout(()=>e.el.remove(),300);
  mount(name,params,true);
}
function switchTab(t){
  closeOverlay();
  stack.forEach(e=>{const d=SCREENS[e.name];d.leave&&d.leave(e);e.el.remove()});stack=[];
  S.tab=t;mount(t,{},false);
  const sc=topE().el.querySelector('.scroll');if(sc)sc.scrollTop=0;
}

  const e=topE();const def=SCREENS[e.name];
  $('#tabbar').classList.toggle('hidden',!def.tab);

  return S.calls.filter(c=>{
    if(S.filter==='open'&&c.status!=='open')return false;
    if(S.filter==='done'&&c.status!=='done')return false;
    if(S.filter==='rec'&&!c.rec)return false;
    if(S.filter==='in'&&c.dir!=='in')return false;
    if(S.filter==='out'&&c.dir!=='out')return false;
    if(q&&!(c.name+c.number+c.summary+c.tr.map(l=>l.text).join('')).toLowerCase().includes(q.replace(/\s/g,''))&&!(c.name+c.number+c.summary).toLowerCase().includes(q))return false;
    return true;
  });
}

const ANSWERS=['可以的，没问题。','建议提前半小时到，周五人比较多。','人均大概 180 元左右。','不需要额外费用。','最早明天上午 9 点。','我们营业到晚上 10 点。'];
function buildScript(L){
  const s=[];
  if(L.mode==='in'){
    s.push(['ai','您好，机主现在不方便接听，我是他的助理，请问有什么事？'],['caller','你好，顺丰快递，家里没人，包裹放哪儿？'],['ai','麻烦放 3 号楼的丰巢柜，放好后能告诉我取件码吗？',0],['caller','行，放好了，取件码 5821。',0],['ai','收到，5821。还需要机主回电吗？'],['caller','不用了。',1],['ai','好的，辛苦您，再见。']);
    return s;
  }
  s.push(['ai','您好，打扰一下，我想咨询点事情。'],['caller','您好，请说。']);
  L.questions.forEach((q,i)=>{s.push(['ai',q.text]);s.push(['caller',ANSWERS[i%ANSWERS.length],i])});
  if(!L.questions.length){s.push(['ai',L.goal]);s.push(['caller','可以的，没问题。'])}
  s.push(['ai','好的，都清楚了，谢谢您，再见！'],['caller','好，再见。']);
  return s;
}
function startLive(o){
  const L=S.live=Object.assign({mode:'out',phase:o.mode==='in'?'connected':'dialing',sec:0,lines:[],idx:0,taken:false,muted:false,speaker:false,typing:null,ended:false,timers:[]},o);
  L.script=buildScript(L);
  L.lines.push({who:'sys',text:L.mode==='in'?`来电 · 响铃 ${S.delay} 秒后 AI 接听`:'开始拨号',t:0});
  const tick=setInterval(()=>{
    if(L.ended)return;
    if(L.phase==='connected'){L.sec++;$$('[data-live-timer]').forEach(n=>n.textContent=fmt(L.sec))}
  },1000);
  L.tick=tick;
  const later=(ms,f)=>{const t=setTimeout(()=>{if(!L.ended)f()},ms);L.timers.push(t)};
  const step=()=>{
    if(L.taken||L.ended)return;
    if(L.idx>=L.script.length){later(1200,()=>endLive('done'));return}
    const [who,text,qi]=L.script[L.idx];
    L.typing=who;liveRefresh();
    later(900+Math.min(1400,text.length*35),()=>{
      L.typing=null;L.lines.push({who,text,t:L.sec});
      if(qi!=null&&L.questions[qi])L.questions[qi].done=true;
      L.idx++;liveRefresh();later(500,step);
    });
  };
  if(L.mode==='out'){
    later(1500,()=>{L.phase='ringing';liveRefresh()});
    later(3200,()=>{L.phase='connected';L.lines.push({who:'sys',text:'已接通 · AI 开始模拟对话',t:0});liveRefresh();later(400,step)});
  }else{L.lines.push({who:'sys',text:'AI 已模拟接听',t:0});later(300,step)}
}
function liveRefresh(){const e=topE();if(e&&e.name==='live')paint(e);else if(e&&e.name==='home')paint(e)}
function endLive(reason){
  const L=S.live;if(!L||L.ended)return;
  L.ended=true;clearInterval(L.tick);L.timers.forEach(t=>clearTimeout(t));L.typing=null;
  const id='c'+Date.now();
  const done=L.questions.filter(q=>q.done).length;
  const rec={id,dir:L.mode,name:L.name,number:L.number,day:'今天',time:hhmm(new Date()),dur:Math.max(L.sec,8),status:'open',rec:true,taken:L.taken,sim:L.sim,
    outcome:L.taken?['已接管','info']:L.mode==='in'?['已留言','info']:(done===L.questions.length?['已问清','ok']:['部分问清','warn']),
    rule:L.mode==='in'?'允许名单 · 命中交代「快递外卖」':undefined,
    summary:L.mode==='in'?'包裹已放 3 号楼丰巢柜，取件码 5821；对方无需回电。':(L.taken?`AI 完成开场后，你在 ${fmt(L.takenAt||L.sec)} 接管通话。`:`${done}/${L.questions.length} 个问题已问清：`+L.lines.filter(l=>l.who==='caller').slice(1).map(l=>l.text.replace(/。$/,'')).join('；')+'。'),
    brief:L.mode==='out'?{goal:L.goal,questions:L.questions.map(q=>q.text),context:L.context||'',constraints:L.constraints||''}:undefined,
    tr:L.lines.map((l,i)=>({t:l.t!=null?l.t:(i?L.sec:0),who:l.who,text:l.text}))};
  rec.tr.forEach((l,i)=>{if(i&&l.t<rec.tr[i-1].t)l.t=rec.tr[i-1].t});

function incomingConnect(){
  const I=S.incoming;clearInterval(I.timer);I.connecting=true;rerender();
  setTimeout(()=>{if(topE().name!=='incoming')return;S.incoming=null;
    const e=stack.pop();e.el.remove();
    startLive({mode:'in',name:'快递员',number:'186 2033 4471',sim:1,questions:[{text:'问清放在哪里',done:false},{text:'是否需要回电',done:false}],goal:''});
    mount('live',{},true);},1100);
}

function readPreview(){
  try{
    const p=JSON.parse(localStorage.getItem(PREVIEW_KEY)||'null');if(!p||p.version!==3)return;
    const d=p.data||{};
    for(const k of ['theme','scope','voice','greeting','instructions','filter','q','order'])if(typeof d[k]==='string')S[k]=d[k];
    if(!['light','dark','system'].includes(S.theme))S.theme='light';
    if(!FILTERS.some(([key])=>key===S.filter))S.filter='all';
    for(const k of ['auto','recovery'])if(typeof d[k]==='boolean')S[k]=d[k];
    for(const [k,min,max] of [['delay',0,15],['maxSec',15,600],['defaultSim',0,2]])if(Number.isFinite(d[k]))S[k]=Math.max(min,Math.min(max,d[k]));
    for(const k of ['allow','bypass'])if(Array.isArray(d[k]))S[k]=d[k].filter(x=>typeof x==='string').slice(0,100);
    if(Array.isArray(d.playbooks)&&d.playbooks.every(p=>p&&['id','title','when','reply','expiry'].every(k=>typeof p[k]==='string')))S.playbooks=d.playbooks.slice(0,100);
    if(Array.isArray(d.calls)&&d.calls.every(c=>c&&['id','name','number','summary','day','time'].every(k=>typeof c[k]==='string')&&Array.isArray(c.tr)&&c.tr.every(l=>l&&typeof l.text==='string')&&Array.isArray(c.outcome)&&(c.dir==='in'||c.brief&&typeof c.brief.goal==='string'&&Array.isArray(c.brief.questions))))S.calls=d.calls.slice(0,200);
    if(d.draft&&typeof d.draft.number==='string'&&typeof d.draft.goal==='string'&&Array.isArray(d.draft.questions))S.draft=newDraft({...d.draft,step:0,err:{}});
    if(d.scroll&&typeof d.scroll==='object')for(const [key,val] of Object.entries(d.scroll))if(Number.isFinite(val))uiScroll[key]=val;
  }catch{/* malformed or unavailable storage does not prevent opening the workspace */}
}
function persistPreview(){
  if(previewResetting)return false;
  const keys=['theme','scope','voice','greeting','instructions','filter','q','order','auto','recovery','delay','maxSec','defaultSim','allow','bypass','playbooks','draft','calls'];
  const data=Object.fromEntries(keys.map(k=>[k,S[k]]));data.scroll=uiScroll;
  try{localStorage.setItem(PREVIEW_KEY,JSON.stringify({version:3,data}));return true;}catch{if(!storageWarning){storageWarning=true;toast('浏览器无法保存草稿，请先导出需要保留的内容','alert')}return false;}
}

const originalPaint=paint;
paint=function(e){
 const active=document.activeElement;const focused=e.el.contains(active)?{id:active.id,act:active.dataset.act,i:active.dataset.i}:null;
 const audio=e.el.querySelector('audio');const audioState=audio?{node:audio,id:e.params.id,time:audio.currentTime,paused:audio.paused,rate:audio.playbackRate}:null;
 originalPaint(e);e.el.dataset.screen=e.name;e.el.classList.toggle('detail-panel',e.name==='detail');
 if(['live','incoming'].includes(e.name)&&!e.el.querySelector('.live-preview')){const n=document.createElement('div');n.className='live-preview';n.textContent='模拟通话 · 不会拨打电话或调用语音服务';e.el.prepend(n)}
 if(audioState&&audioState.id===e.params.id){const next=e.el.querySelector('audio');if(next&&next.getAttribute('src')===audioState.node.getAttribute('src')){next.replaceWith(audioState.node);const restore=()=>{audioState.node.currentTime=audioState.time;audioState.node.playbackRate=audioState.rate;if(!audioState.paused)audioState.node.play().catch(()=>{})};if(audioState.node.readyState)restore();else audioState.node.addEventListener('loadedmetadata',restore,{once:true})}else audioState.node.pause()}
 if(focused){let next=focused.id?e.el.querySelector('#'+CSS.escape(focused.id)):null;if(!next&&focused.act)next=[...e.el.querySelectorAll('[data-act]')].find(x=>x.dataset.act===focused.act&&x.dataset.i===focused.i);next?.focus({preventScroll:true})}
 const sc=e.el.querySelector('.scroll');if(sc&&!sc.dataset.bound){sc.dataset.bound='1';sc.addEventListener('scroll',()=>{uiScroll[e.name]=sc.scrollTop},{passive:true})}
 scheduleSave();
};

const oldSheet=openSheet,oldConfirm=confirmDialog;let overlayTrigger=null;
function dialogA11y(){const dlg=$('#overlay [role=dialog],#overlay [role=alertdialog]');if(!dlg)return;overlayTrigger=overlayTrigger||document.activeElement;const heading=dlg.querySelector('h3');if(heading){heading.id='dialog-title';dlg.setAttribute('aria-labelledby','dialog-title')}else dlg.setAttribute('aria-label','操作菜单');$('#stack').inert=true;$('#sidebar').inert=true;$('#workspacebar').inert=true;$('#tabbar').inert=true;if(!dlg.querySelector('.sheet-close')&&dlg.classList.contains('sheet'))dlg.insertAdjacentHTML('afterbegin',`<button class="iconbtn sheet-close" data-act="closeSheet" aria-label="关闭弹窗">${ic('x')}</button>`);requestAnimationFrame(()=>dlg.querySelector('input,textarea,button')?.focus());}
openSheet=function(o){oldSheet(o);dialogA11y()};confirmDialog=function(o){const p=oldConfirm(o);dialogA11y();return p.finally(restoreOverlayFocus)};
function restoreOverlayFocus(){$('#stack').inert=false;$('#sidebar').inert=false;$('#workspacebar').inert=false;$('#tabbar').inert=false;const trg=overlayTrigger;overlayTrigger=null;if(trg?.isConnected&&!trg.closest('[inert]'))trg.focus({preventScroll:true});else topE()?.el.querySelector('h1,.navbar button')?.focus({preventScroll:true})}
const oldClose=closeOverlay;closeOverlay=function(){const dlg=$('#overlay [role=dialog],#overlay [role=alertdialog]');if(dlg)dlg.inert=true;oldClose();restoreOverlayFocus()};
function commandResults(q=''){q=q.trim().toLowerCase();const screens=NAV.filter(n=>!q||n[2].includes(q));const calls=S.calls.filter(c=>q&&(c.name+c.number+c.summary+c.tr.map(l=>l.text).join('')).toLowerCase().replace(/\s/g,'').includes(q.replace(/\s/g,''))).slice(0,12);return `${screens.length?'<div class="command-group">前往</div>':''}${screens.map(([k,i,t])=>`<button class="command-item" data-act="commandRoute" data-tab="${k}">${ic(i)}${t}<small>页面</small></button>`).join('')}${calls.length?'<div class="command-group">通话记录</div>':''}${calls.map(c=>`<button class="command-item" data-act="commandCall" data-id="${esc(c.id)}">${ic('phone')}<span>${esc(c.name)}</span><small>${esc(c.day)}</small></button>`).join('')}${!screens.length&&!calls.length?'<div class="command-empty">没有找到相关页面或通话，试试其他关键词。</div>':''}`}
function openCommand(){openSheet({title:'搜索工作区',id:'command',body:`<div class="command-search">${ic('search')}<input type="search" id="commandQ" placeholder="搜索页面、联系人或通话内容" aria-label="搜索页面和通话"></div><div id="commandResults">${commandResults()}</div><div class="help-keyboard"><span>↑ ↓ 选择</span><span>Enter 打开</span><span>Esc 关闭</span></div>`});requestAnimationFrame(()=>$('#commandQ')?.focus())}
function downloadText(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('已复制');}catch{openSheet({title:'复制内容',desc:'浏览器未允许剪贴板访问，可全选下方内容复制。',body:`<textarea class="textarea" readonly aria-label="待复制内容" style="min-height:180px">${esc(value)}</textarea>`})}}
function validateDraft(){const d=S.draft;d.err={};if(!/^\+?[\d\s()-]{7,24}$/.test(d.number.trim())||digits(d.number).length<7||digits(d.number).length>15)d.err.number='请输入 7–15 位普通电话号码';if(!SIMS.some(s=>s.id===d.sim))d.err.sim='请选择拨号 SIM';if(!d.goal.trim()||d.goal.length>400)d.err.goal='请写下本次目标（1–400 字）';return !Object.keys(d.err).length}

 command:openCommand,mobileMenu:()=>openSheet({title:'个人工作区',body:NAV.map(([k,i,t])=>`<button class="menu-item" data-act="commandRoute" data-tab="${k}">${ic(i)}${t}${k===S.tab?chip('当前','gray'):''}</button>`).join('')}),

 startTemplate:el=>{const t=TEMPLATES[+el.dataset.i];const go=()=>{S.draft=newDraft({goal:t[1],questions:t[2].slice()});push('compose');persistPreview()};if(S.draft&&(S.draft.number||S.draft.goal))confirmDialog({title:'用模板新建任务？',body:'当前已有草稿，使用模板会替换它。',ok:'使用模板'}).then(ok=>{if(ok)go()});else go()},

 copyTr:el=>{const c=findCall(el.dataset.id||topE().params.id);if(c)copyText([c.name+' · '+c.day+' '+c.time,'[示例转写]',...c.tr.map(l=>`${fmt(l.t)} ${l.who==='ai'?'AI':l.who==='caller'?'对方':'系统'}：${l.text}`)].join('\n'))},
 exportCalls:()=>{downloadText('Flash-phone-示例记录.json',JSON.stringify({kind:'local-preview',exported_at:new Date().toISOString(),calls:S.calls},null,2));toast('已导出当前示例记录')},
 shareRec:()=>{const a=localAudio.get(topE().params.id);if(!a){toast('尚未选择本地录音，无法导出','info');return}const link=document.createElement('a');link.href=a.url;link.download=a.name;link.click();toast('已导出所选本地录音')},
 seekLine:el=>{const audio=$('#localPlayer');if(audio)toast('这份本地录音与示例转写未对齐，请使用播放器定位','info');else toast('示例未附音频，可先选择本地录音','info')},

 repo:()=>window.open('https://github.com/DzsGatsby/FlashPhone','_blank','noopener'),openConsole:()=>window.open('https://flash-phone.dzsgatsby.workers.dev','_blank','noopener'),
 addDevice:()=>openSheet({title:'连接一台设备',desc:'真正的设备授权在已登录的控制台完成；预览不会生成虚假配对码。',body:`<div class="steps-list"><li>打开真实控制台，以已有授权登录。</li><li>在「设备与授权」生成一次性设备授权码。</li><li>在 Android 或 Mac 桥接端输入授权码，等待真实状态回报。</li></div><button class="btn primary" data-act="openConsole" style="margin-top:20px">打开真实控制台 ${ic('external')}</button>`}),
 bridgeHelp:()=>openSheet({title:'Mac 与 iPhone 桥接',desc:'电话中继、AI 接管和双向声音是分别核验的状态。',body:`<p class="mini">设备端需要同一 Apple 账号下的通话中继。AI 接管还需要通话状态和音频路由通过实际核验。本预览不读取这些权限或声称已连接。</p><button class="btn primary" data-act="openConsole">查看真实设备状态</button>`}),
 mcpInfo:()=>openSheet({title:'MCP 与智能体',desc:'让任务有明确目标，也有可以追溯的结果。',body:`<div class="card">${row({icon:'phoneOut',t:'委派',d:'选择执行设备、号码和本次目标',chev:false})}${row({icon:'clock',t:'跟进',d:'查看任务进度，必要时停止 AI 或明确挂断',chev:false})}${row({icon:'file',t:'回收结果',d:'读取设备返回的原文、结果与可用录音',chev:false})}</div><p class="mini" style="margin:16px 0">MCP 入口：<code style="overflow-wrap:anywhere">https://flash-phone.dzsgatsby.workers.dev/mcp</code><br>客户端需要机主授权。请勿将密钥写入此预览。</p><button class="btn ghost" data-act="copyMcp">复制 MCP 地址</button>`}),copyMcp:()=>copyText('https://flash-phone.dzsgatsby.workers.dev/mcp'),
 credSheet:()=>openSheet({title:'豆包实时语音',desc:'当前方案仍使用豆包端到端实时语音 3.0。',body:`<p style="font-size:14px;line-height:1.8">真实语音凭据应在已授权设备中配置。本地前端预览不接收或保存 API Key，也不会模拟“验证成功”。</p><button class="btn ghost" data-act="goDevice">查看设备</button>`}),saveCred:()=>{},

 fixReady:()=>openSheet({title:'设备设置由设备端完成',desc:'浏览器预览不能授予系统权限或启动后台服务。',body:`<p class="mini">真实权限、音频助手与电池优化状态以执行设备回报为准。</p><button class="btn ghost" data-act="openConsole">打开真实控制台</button>`}),

});

A.toggleAuto=()=>{toggleOriginal();toast(S.auto?'已在预览中开启自动接听':'已在预览中关闭自动接听');persistPreview()};

const endOriginal=endLive;

A.delCall=el=>{const id=el.dataset.id;confirmDialog({title:'删除这条示例记录？',body:'仅从此浏览器移除，手机与云端记录不受影响。',ok:'删除',danger:true}).then(ok=>{if(!ok)return;const c=findCall(id);const index=S.calls.findIndex(x=>x.id===id);S.calls.splice(index,1);pop();persistPreview();openSheet({title:'示例记录已删除',body:`<p class="mini">可以在这里立即撤销。</p><button class="btn ghost" id="undoDelete">撤销删除</button>`});$('#undoDelete').onclick=()=>{S.calls.splice(index,0,c);closeOverlay();rerender();chrome();persistPreview();toast('已恢复记录')}})};
A.clearAll=()=>confirmDialog({title:'清空示例通话记录？',body:'只清空此浏览器的示例数据。可在设置中恢复初始示例。',ok:'清空',danger:true}).then(ok=>{if(ok){S.calls=[];rerender();chrome();persistPreview()}});
document.addEventListener('input',ev=>{if(ev.target.id==='commandQ')$('#commandResults').innerHTML=commandResults(ev.target.value);scheduleSave()});
document.addEventListener('change',ev=>{const el=ev.target;if(el.matches('[data-select-sim]')){S.draft.sim=Number(el.value);S.draft.err.sim=null;persistPreview()}if(el.matches('[data-audio-id]')){const file=el.files?.[0];if(!file)return;if(file.size>100*1024*1024){toast('请选择小于 100 MB 的音频文件','alert');return}if(!file.type.startsWith('audio/')&&!/\.(wav|mp3|m4a|ogg|flac)$/i.test(file.name)){toast('请选择音频格式的文件','alert');return}const id=el.dataset.audioId;const previous=localAudio.get(id);if(previous)URL.revokeObjectURL(previous.url);localAudio.set(id,{url:URL.createObjectURL(file),name:file.name});rerender();$('#localPlayer')?.addEventListener('error',()=>toast('浏览器无法解码此文件，请选择 WAV 或 MP3','alert'),{once:true})}});
document.addEventListener('click',()=>{scheduleSave();setTimeout(()=>{if(topE())chrome()},0)});
document.addEventListener('keydown',ev=>{
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openCommand();return}
 if(ev.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)){ev.preventDefault();openCommand();return}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('a[data-act]')){ev.preventDefault();ev.target.click()}
 const dlg=$('#overlay .sheet.show,#overlay .dialog.show');if(!dlg||dlg.inert)return;
 if(ev.key==='Tab'){const items=[...dlg.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),textarea:not([disabled]),select,[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=items[0],last=items.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus()}}
 if(dlg.dataset.sheet==='command'&&['ArrowDown','ArrowUp','Enter'].includes(ev.key)){const list=[...dlg.querySelectorAll('.command-item')];const i=list.indexOf(document.activeElement);if(ev.key==='Enter'&&ev.target.id==='commandQ'){ev.preventDefault();list[0]?.click()}else if(ev.key!=='Enter'){ev.preventDefault();list[Math.max(0,Math.min(list.length-1,i+(ev.key==='ArrowDown'?1:-1)))]?.focus()}}
});
