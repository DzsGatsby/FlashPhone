name: iPhone capture research build
on:
  push:
    branches: [research/iphone-capture-20261113]
permissions:
  contents: read
concurrency:
  group: iphone-capture-research-20261113
  cancel-in-progress: true
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Verify toolchain and prepare reviewed Apple sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source receipt
          xcodebuild -version | tee receipt/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version | tee receipt/sdk.txt
          sw_vers > receipt/host.txt
          curl --fail --location --max-time 60 --retry 1 'https://docs-assets.developer.apple.com/published/91f0562d72a9/CapturingScreenContentInIOS.zip' -o sample.zip
          echo 'd6d3f4068458490d9ddb5771636c135bcff98025d1ae38fa4a1b0fbb37a229a1  sample.zip' | shasum -a 256 -c -
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          import zipfile,base64
          with zipfile.ZipFile('sample.zip') as z:
              for entry in z.infolist():
                  p=Path(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if '.git' in p.parts or entry.is_dir(): continue
                  target=Path('source')/p
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(entry))
          Path('source/probe.patch').write_bytes(base64.b64decode(''))
          PYEXTRACT
          cd source
          git apply --check probe.patch
          git apply probe.patch
          shasum -a 256 probe.patch > ../receipt/patch-sha256.txt
          plutil -lint iOSSCKSample/Info.plist iOSSCKSample/iOSSCKSample.entitlements
      - name: Build device probe without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -project iOSSCKSample.xcodeproj -scheme iOSSCKSample -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO PRODUCT_BUNDLE_IDENTIFIER=local.flashphone.callprobe build 2>&1 | tee ../receipt/build.log
          cd ..
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent derived/Build/Products/Debug-iphoneos/iOSSCKSample.app artifact/FlashPhone-iOS-Probe-unsigned.zip
          shasum -a 256 artifact/FlashPhone-iOS-Probe-unsigned.zip > receipt/artifact-sha256.txt
          plutil -convert json -o receipt/app-info.json derived/Build/Products/Debug-iphoneos/iOSSCKSample.app/Info.plist
          python3 - <<'PYSDK'
          from pathlib import Path
          import subprocess
          sdk=Path(subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip())
          for framework in ['MediaDevice','ScreenCaptureKit']:
              d=sdk/'System/Library/Frameworks'/f'{framework}.framework'/'Headers'
              hits=[]
              for p in d.glob('*.h'):
                  lines=p.read_text(errors='replace').splitlines()
                  for i,line in enumerate(lines):
                      if any(term in line for term in ['AudioServerPlugInRegisterMediaDeviceExtension','capturesAudio','captureMicrophone','excludesCurrentProcessAudio']):
                          hits.append(p.name+'\n'+'\n'.join(lines[max(0,i-8):min(len(lines),i+8)]))
              Path('receipt/'+framework+'-sdk-symbols.txt').write_text('\n\n'.join(hits))
          PYSDK
      - name: Preserve bounded build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-capture-probe
          path: |
            receipt/
            artifact/
          retention-days: 1
          if-no-files-found: error
