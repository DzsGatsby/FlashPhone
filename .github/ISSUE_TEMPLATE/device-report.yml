name: 通话与机型兼容性 / Calling and device compatibility
description: Report a Flash phone calling, standby, or audio helper issue / 报告 Flash phone 通话、待命或音频助手问题
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        请勿公开电话号码、通话原文、密钥或配对码。仅提交同意参与的测试通话。
        Please omit phone numbers, call transcripts, credentials, and pairing codes. Use a test call with the other person's consent.
  - type: input
    id: model
    attributes:
      label: 手机型号 / Phone model
      description: 厂商和型号 / Manufacturer and model
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Android 和系统版本 / Android and system version
      description: Android 版本及厂商系统版本 / Include both Android and vendor software versions
    validations:
      required: true
  - type: input
    id: flash-phone-version
    attributes:
      label: Flash phone 版本 / Flash phone version
      description: 设置 → 关于 / Settings → About
    validations:
      required: true
  - type: dropdown
    id: calling-stage
    attributes:
      label: 遇到问题的功能 / Feature affected
      options:
        - "通话助手设置或恢复 / Audio helper setup or recovery"
        - "来电或后台待命 / Incoming call or background standby"
        - "主动拨出 / Outgoing call"
        - "语音、打断或人工接管 / Audio, interruption, or takeover"
        - "记录或应用更新 / Records or app update"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果 / Steps and observed behavior
      description: 说明锁屏与否、助手和待命是否就绪、两端各听到什么、期望结果 / Include lock state, helper and standby status, what both sides heard, and the expected result
    validations:
      required: true
